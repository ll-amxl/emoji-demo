const parts = [
  { id: 'head', label: '头部', color: '#ffcc70', indices: [7, 8, 0], edges: [[7, 0], [0, 8]] },
  { id: 'torso', label: '躯干', color: '#a8f5cd', indices: [11, 12, 23, 24], edges: [[11, 12], [12, 24], [24, 23], [23, 11]] },
  { id: 'leftArm', label: '左臂', color: '#8bcfff', indices: [11, 13, 15], edges: [[11, 13], [13, 15]] },
  { id: 'rightArm', label: '右臂', color: '#c5a5ff', indices: [12, 14, 16], edges: [[12, 14], [14, 16]] },
  { id: 'leftLeg', label: '左腿', color: '#ff9f9f', indices: [23, 25, 27], edges: [[23, 25], [25, 27]] },
  { id: 'rightLeg', label: '右腿', color: '#f3a5dd', indices: [24, 26, 28], edges: [[24, 26], [26, 28]] },
]

function getBodyParts(landmarks = [], width = 1, height = 1) {
  return Object.fromEntries(parts.map(({ id, indices, edges }) => {
    const points = {}
    for (const index of indices) {
      const point = landmarks[index]
      if (point && point.visibility >= 0.55 && point.x >= 0 && point.x <= 1 && point.y >= 0 && point.y <= 1) {
        points[index] = { x: point.x * width, y: point.y * height }
      }
    }
    const segments = edges.flatMap(([from, to]) => {
      const start = points[from]
      const end = points[to]
      if (!start || !end) return []
      const dx = end.x - start.x
      const dy = end.y - start.y
      return [{ start, end, length: Math.hypot(dx, dy), angle: Math.atan2(dy, dx) }]
    })
    return [id, { points, segments, tracked: indices.every(index => points[index]) }]
  }))
}

function headTilt(points) {
  const left = points[7]
  const right = points[8]
  if (!left || !right || Math.hypot(left.x - right.x, left.y - right.y) < 8) return 0
  // Measure the ear line from screen left to right to avoid a 180-degree flip.
  const [start, end] = left.x <= right.x ? [left, right] : [right, left]
  const angle = Math.atan2(end.y - start.y, end.x - start.x)
  return Math.max(-Math.PI / 3, Math.min(Math.PI / 3, angle * tilt.valueAsNumber / 100))
}

const galleryEndpoint = 'https://emoji-exhibit-online-v1.spiritedkookaburra8.chatgpt.site/api/gallery'

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)')
let galleryPaused = reduceMotion.matches
let galleryAnimation
let galleryRequest
const galleryRetry = document.querySelector('#gallery-retry')

function updateGalleryMotion() {
  galleryMotion.textContent = galleryPaused ? '继续滚动' : '暂停滚动'

updateGalleryMotion()

function showGalleryDetail(entry) {
  document.querySelector('#gallery-image').src = entry.image
  document.querySelector('#gallery-name').textContent = entry.nickname
  document.querySelector('#gallery-bio').textContent = entry.bio || '暂无简介'
  galleryDetail.showModal()
}

function displayGallery(entries) {
  galleryRows.replaceChildren()
  galleryMotion.hidden = entries.length === 0
  if (!entries.length) return
  for (let rowNumber = 0; rowNumber < 3; rowNumber++) {
    const row = document.createElement('div')
    row.className = 'gallery-row'
    const track = document.createElement('div')
    track.className = 'gallery-track'
    const items = entries.filter((_, index) => index % 3 === rowNumber)
    const visibleItems = items.length ? items : [entries[rowNumber % entries.length]]
    const count = Math.max(visibleItems.length, 7)
    for (let index = 0; index < count; index++) {
      const entry = visibleItems[index % visibleItems.length]
      const button = document.createElement('button')
      button.className = 'gallery-card'
      const image = new Image()
      image.alt = ''
      image.src = entry.image
      const name = document.createElement('span')
      name.textContent = entry.nickname
      button.append(image, name)
      button.onclick = () => showGalleryDetail(entry)
      track.append(button)
    }
    row.append(track)
    galleryRows.append(row)
  }

  let last = 0
  const animate = timestamp => {
    const delta = last ? Math.min(timestamp - last, 50) : 0
    last = timestamp
    if (!galleryPaused && !galleryDetail.open) {
      Array.from(galleryRows.children).forEach((row, index) => {
        if (row.matches(':hover, :focus-within')) return
        let position = Number(row.dataset.position ?? row.scrollLeft)
        const limit = row.scrollWidth - row.clientWidth
        const direction = Number(row.dataset.direction ?? (index % 2 ? -1 : 1))
        if (limit <= 0) return
        position += direction * delta * (0.025 + index * 0.006)
        if (position <= 0 || position >= limit) row.dataset.direction = String(position <= 0 ? 1 : -1)
        position = Math.max(0, Math.min(limit, position))
        row.dataset.position = String(position)
        row.scrollLeft = position
      })
    }
    galleryAnimation = requestAnimationFrame(animate)
  }
  galleryAnimation = requestAnimationFrame(animate)
}

async function openGallery({ focus = true } = {}) {
  cancelAnimationFrame(galleryAnimation)
  galleryRequest?.abort()
  cameraView.hidden = true
  profileView.hidden = true
  gallery.hidden = false
  stop()
  if (focus) document.querySelector('#gallery-title').focus()
  galleryRetry.hidden = true
  galleryStatus.textContent = '正在加载公共作品'
  galleryMotion.hidden = true
  galleryRows.replaceChildren()
  if (location.protocol === 'file:') {
    const link = document.createElement('a')
    link.href = 'https://emoji-exhibit-online-v1.spiritedkookaburra8.chatgpt.site'
    link.textContent = '打开在线试玩页'
    galleryStatus.replaceChildren('本地 HTML 无法连接公共图库。', link)
    return
  }
  try {
    const request = new AbortController()
    galleryRequest = request
    const response = await fetch(galleryEndpoint, { signal: request.signal, cache: 'no-store' })
    if (!response.ok) throw new Error()
    const entries = (await response.json()).map(entry => ({
      ...entry,
      image: new URL(entry.image, galleryEndpoint).href,
    }))
    if (gallery.hidden || request !== galleryRequest) return
    galleryStatus.textContent = entries.length ? '' : '还没有公开作品'
    displayGallery(entries)
  } catch (error) {
    if (error.name === 'AbortError' || gallery.hidden) return
    galleryStatus.textContent = '照片墙暂时无法加载，你仍可以去拍照。'
    galleryRetry.hidden = false
  }
}

async function outputPreference(mode, directory) {
  const database = await new Promise((resolve, reject) => {
    const request = indexedDB.open('emoji-output', 1)
    request.onupgradeneeded = () => request.result.createObjectStore('settings')
    request.onsuccess = () => resolve(request.result)
    request.onerror = () => reject(request.error)
  })
  try {
    return await new Promise((resolve, reject) => {
      const transaction = database.transaction('settings', mode)
      const store = transaction.objectStore('settings')
      const request = directory ? store.put(directory, 'directory') : store.get('directory')
      transaction.oncomplete = () => resolve(request.result)
      transaction.onabort = () => reject(transaction.error)
    })
  } finally {
    database.close()
  }
}

function setOutputDirectory(directory) {
  outputDirectory = directory
  outputStatus.textContent = `保存到：${directory.name}`

  try {
    const directory = await window.showDirectoryPicker({ id: 'emoji-output', mode: 'readwrite', startIn: outputDirectory ?? 'documents' })
    setOutputDirectory(directory)
    outputPreference('readwrite', directory).catch(() => {
      outputStatus.textContent = `本次保存到：${directory.name}（浏览器无法记住此文件夹）`
    })
  } catch (error) {

}

download.onclick = async event => {
  if (!outputDirectory || !snapshotBlob) return
  event.preventDefault()
  const stamp = new Date().toISOString().replace(/[:.]/g, '-')
  const filename = `twemoji-${stamp}-${crypto.randomUUID().slice(0, 8)}.png`
  try {
    const directory = outputDirectory
    if (await directory.requestPermission({ mode: 'readwrite' }) !== 'granted') {
      outputStatus.textContent = '请允许写入输出文件夹后再保存'
      return
    }
    const file = await directory.getFileHandle(filename, { create: true })
    const writer = await file.createWritable()
    await writer.write(snapshotBlob)
    await writer.close()
    outputStatus.textContent = `已保存到「${directory.name}」：${filename}`
  } catch {
    outputStatus.textContent = '保存失败，请重新选择输出文件夹，或点击「下载 PNG」'
    outputDirectory = undefined
    download.textContent = '下载 PNG'
  }
}

function setStatus(message) {
  if (status.textContent !== message) status.textContent = message
}

function matchHands(bodyParts, hands, width, height) {
  const candidates = []
  for (const [id, wristIndex] of [['leftArm', 15], ['rightArm', 16]]) {
    const wrist = bodyParts[id].points[wristIndex]
    if (!wrist) continue
    hands.forEach((hand, index) => {
      const start = { x: hand[0].x * width, y: hand[0].y * height }
      const palm = { x: hand[9].x * width, y: hand[9].y * height }
      const distance = Math.hypot(wrist.x - start.x, wrist.y - start.y)
      if (distance < Math.min(width, height) * 0.12) candidates.push({ id, index, start, palm, distance })
    })
  }
  const used = new Set()
  for (const candidate of candidates.sort((a, b) => a.distance - b.distance)) {
    if (used.has(candidate.index) || bodyParts[candidate.id].hand) continue
    bodyParts[candidate.id].hand = candidate
    used.add(candidate.index)
  }
}

function measureSticker(id, part) {
  if (!part) return
  const points = Object.values(part.points)
  if (!points.length || !part.segments.length) return
  const xs = points.map(point => point.x)
  const ys = points.map(point => point.y)
  const width = Math.max(...xs) - Math.min(...xs)
  const height = Math.max(...ys) - Math.min(...ys)
  let x = Math.min(...xs) + width / 2
  let y = Math.min(...ys) + height / 2
  let size = Math.max(width, height)
  let angle = 0
  if (id === 'head') {
    angle = headTilt(part.points)
  } else if (id === 'torso') {
    const { 11: leftShoulder, 12: rightShoulder, 23: leftHip, 24: rightHip } = part.points
    if (leftShoulder && rightShoulder && leftHip && rightHip) {
      const dx = leftHip.x + rightHip.x - leftShoulder.x - rightShoulder.x
      const dy = leftHip.y + rightHip.y - leftShoulder.y - rightShoulder.y
      if (Math.hypot(dx, dy) >= 8) angle = Math.atan2(-dx, dy)
    }
  }

  if (id.endsWith('Arm')) {
    const distalIndices = { leftArm: [13, 15], rightArm: [14, 16] }
    const [jointIndex, endIndex] = distalIndices[id]
    const joint = part.points[jointIndex]
    const end = part.points[endIndex]
    if (!joint || !end) return
    const length = Math.hypot(end.x - joint.x, end.y - joint.y)
    if (length >= 8) angle = Math.atan2(joint.x - end.x, end.y - joint.y)
    angle += Math.PI
    x = end.x
    y = end.y
    size = Math.max(...part.segments.map(segment => segment.length)) * 0.85
  } else {
    size *= id === 'head' ? 2.5 : 1.05
  }

  if (part.hand) {
    const { start, palm } = part.hand
    const dx = palm.x - start.x
    const dy = palm.y - start.y
    if (Math.hypot(dx, dy) >= 8) {
      x = (start.x + palm.x) / 2
      y = (start.y + palm.y) / 2
      angle = Math.atan2(dx, -dy)
      size = Math.hypot(dx, dy) * 2.4
    }
  }

  return { x, y, size: Math.max(18, size), angle }
}

function updateStickerMotion(id, part, time) {
  const sample = measureSticker(id, part)
  const previous = stickerMotion.get(id)
  if (!sample) {
    if (previous && time - previous.time > 160) stickerMotion.delete(id)
    return
  }
  if (!previous || time - previous.time > 160) {
    stickerMotion.set(id, { ...sample, time })
    return
  }
  const distance = Math.hypot(sample.x - previous.x, sample.y - previous.y)
  const jump = distance > Math.max(32, previous.size * 0.8)
  if (jump && (!previous.pending || time - previous.pending.time > 100 ||
      Math.hypot(sample.x - previous.pending.x, sample.y - previous.pending.y) > Math.max(24, previous.size * 0.6))) {
    previous.pending = { x: sample.x, y: sample.y, time }
    return
  }
  const elapsed = time - previous.time
  const weight = 1 - Math.exp(-elapsed / (distance > previous.size * 0.2 ? 55 : 115))
  const shapeWeight = 1 - Math.exp(-elapsed / 130)
  const delta = sample.angle - previous.angle
  stickerMotion.set(id, {
    x: previous.x + (sample.x - previous.x) * weight,
    y: previous.y + (sample.y - previous.y) * weight,
    size: previous.size + (sample.size - previous.size) * shapeWeight,
    angle: previous.angle + Math.atan2(Math.sin(delta), Math.cos(delta)) * shapeWeight,
    time,
    pending: jump ? { x: sample.x, y: sample.y, time } : undefined,
  })
}

function drawSticker(context, id, part, includeArms) {
  const transform = stickerMotion.get(id)
  if (!transform) return
  const { x, y, size, angle } = transform
  if (includeArms && id.endsWith('Arm') && part?.segments.length) {
    context.strokeStyle = stickers[id].color
    context.lineCap = 'round'
    context.lineWidth = Math.max(12, Math.max(...part.segments.map(segment => segment.length)) * 0.55)
    for (const { start, end } of part.segments) {
      context.beginPath()
      context.moveTo(start.x, start.y)
      context.lineTo(end.x, end.y)
      context.stroke()
    }
  }
  context.save()
  context.translate(x, y)
  context.rotate(angle)
  if (mirror.checked !== (id === 'rightArm')) context.scale(-1, 1)
  const image = selectedImages.get(id)
  if (image?.complete && image.naturalWidth) {
    const scale = size / Math.max(image.naturalWidth, image.naturalHeight)
    const width = image.naturalWidth * scale
    const height = image.naturalHeight * scale
    context.drawImage(image, -width / 2, -height / 2, width, height)
  }
  context.restore()
}

function drawEmojiLayers(context, bodyParts, includeArms) {
  for (const id of stickerLayers) {
    const part = bodyParts[id]
    const { button } = controls.get(id)
    if (button.getAttribute('aria-pressed') === 'true') {
      drawSticker(context, id, part, includeArms)
    }
  }
}

snapshot.onclick = () => {
  captureAt = performance.now() + 3000
  snapshot.disabled = true
  countdown.textContent = '3 秒后拍摄'
  guideCountdown.textContent = '3'
  captureGuide.hidden = false
}

function updateSnapshot(timestamp, bodyParts, width, height) {
  if (!captureAt) return
  if (timestamp < captureAt) {
    const seconds = Math.ceil((captureAt - timestamp) / 1000)
    const message = seconds + ' 秒后拍摄'
    if (guideCountdown.textContent !== String(seconds)) guideCountdown.textContent = seconds
    if (countdown.textContent !== message) countdown.textContent = message
    return
  }

  captureAt = 0
  captureGuide.hidden = true
  const output = document.createElement('canvas')
  output.width = captureRegion.width
  output.height = captureRegion.height
  const target = output.getContext('2d')
  target.fillStyle = '#fff'
  target.fillRect(0, 0, output.width, output.height)
  target.translate(-captureRegion.x, -captureRegion.y)
  if (mirror.checked) {
    target.translate(canvas.width, 0)
    target.scale(-1, 1)
  }
  fitCameraFrame(target, width, height)
  drawEmojiLayers(target, bodyParts, false)
  countdown.textContent = '正在生成快照'
  output.toBlob(blob => {
    snapshot.disabled = !stream || !emoji.checked
    if (!blob) {
      countdown.textContent = '快照生成失败'
      return
    }
    if (snapshotUrl) URL.revokeObjectURL(snapshotUrl)
    snapshotBlob = blob
    snapshotUrl = URL.createObjectURL(blob)
    preview.src = snapshotUrl
    download.href = snapshotUrl
    if (!cameraView.hidden) snapshotDialog.showModal()
    countdown.textContent = Object.values(bodyParts).some(part => part.segments.length)
      ? '快照已生成' : '快照已生成，拍摄时未识别到部件'
  }, 'image/png')
}

function fitCameraFrame(context, width, height) {
  const scale = Math.max(canvas.width / width, canvas.height / height)
  context.translate((canvas.width - width * scale) / 2, (canvas.height - height * scale) / 2)
  context.scale(scale, scale)
}

function render(bodyParts, sourceWidth = 0, sourceHeight = 0) {
  context.clearRect(0, 0, canvas.width, canvas.height)
  context.save()
  try {
    if (sourceWidth && sourceHeight) {
      // Center-crop the video and apply the same transform to its landmarks.
      fitCameraFrame(context, sourceWidth, sourceHeight)
      context.fillStyle = '#fff'
      context.fillRect(0, 0, sourceWidth, sourceHeight)
      context.globalAlpha = 0.28
      context.drawImage(video, 0, 0, sourceWidth, sourceHeight)
      context.globalAlpha = 1
    }
    for (const { id, color } of parts) {
      const { button, state } = controls.get(id)
      const part = bodyParts[id]
      const label = part?.tracked ? '已追踪' : part?.segments.length ? '部分可见' : '待追踪'
      if (state.textContent !== label) state.textContent = label
      if (!part || button.getAttribute('aria-pressed') !== 'true') continue
      if (emoji.checked) continue
      context.strokeStyle = color
      context.fillStyle = color
      context.lineWidth = Math.max(2, canvas.width / 220)
      context.lineCap = 'round'
      for (const { start, end } of part.segments) {
        context.beginPath()
        context.moveTo(start.x, start.y)
        context.lineTo(end.x, end.y)
        context.stroke()
      }
      for (const { x, y } of Object.values(part.points)) {
        context.beginPath()
        context.arc(x, y, context.lineWidth, 0, Math.PI * 2)
        context.fill()
      }
    }
    if (emoji.checked) drawEmojiLayers(context, bodyParts, true)
  } finally {
    context.restore()
  }
}

async function loadModel() {
  const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21'
  const { FilesetResolver, PoseLandmarker, HandLandmarker } = await import(base + '/vision_bundle.mjs')
  const vision = await FilesetResolver.forVisionTasks(base + '/wasm')
  try {
    handModel = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
      },
      runningMode: 'VIDEO',
      numHands: 2,
    })
  } catch (error) {
    console.warn('Hand tracking unavailable', error)
  }
  return PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
    },
    runningMode: 'VIDEO',
    numPoses: 1,
  })
}

function stop(message = '摄像头未开启') {
  stickerMotion.clear()
  captureAt = 0
  captureGuide.hidden = true
  snapshot.disabled = true
  countdown.textContent = ''
  cancelAnimationFrame(frame)
  stream?.getTracks().forEach(track => track.stop())
  stream = undefined
  video.srcObject = null
  placeholder.hidden = false
  camera.textContent = '开启摄像头'
  previousTime = -1
  render({})
  setStatus(message)
}

function track(timestamp) {
  try {
    if (video.readyState >= 2 && video.currentTime !== previousTime) {
      previousTime = video.currentTime
      const { landmarks } = model.detectForVideo(video, timestamp)
      const bodyParts = getBodyParts(landmarks[0], video.videoWidth, video.videoHeight)
      let hands = []
      if (landmarks.length && handModel && emoji.checked) {
        try {
          hands = handModel.detectForVideo(video, timestamp).landmarks
          matchHands(bodyParts, hands, video.videoWidth, video.videoHeight)
        } catch (error) {
          console.warn('Hand tracking stopped', error)
          handModel.close()
          handModel = undefined
        }
      }
      for (const id of stickerLayers) updateStickerMotion(id, bodyParts[id], timestamp)
      render(bodyParts, video.videoWidth, video.videoHeight)
      updateSnapshot(timestamp, bodyParts, video.videoWidth, video.videoHeight)
      setStatus(landmarks.length ? (bodyParts.leftArm.hand || bodyParts.rightArm.hand ? '正在追踪人体和手掌' : '正在追踪人体') : '未检测到人体，请进入画面')
    }
    frame = requestAnimationFrame(track)
  } catch (error) {
    console.error(error)
    stop('追踪中断，请重新开启摄像头')
  }
}

camera.onclick = async () => {
  if (stream) {
    stop()
    return
  }
  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus('当前浏览器不允许此页面访问摄像头，请尝试用 Chrome 或 Edge 打开')
    return
  }
  camera.disabled = true
  try {
    setStatus('等待摄像头授权')
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1920 }, height: { ideal: 1080 }, aspectRatio: { ideal: 16 / 9 }, facingMode: 'user' },
      audio: false,
    })
    if (cameraView.hidden) {
      stop()
      return
    }
    const activeStream = stream
    activeStream.getVideoTracks()[0].addEventListener('ended', () => {
      if (stream === activeStream) stop('摄像头连接已中断')
    })
    video.srcObject = stream
    await video.play()
    placeholder.hidden = true
    setStatus('正在加载姿态模型')
    model ??= await loadModel()
    if (stream !== activeStream) return
    camera.textContent = '关闭摄像头'
    snapshot.disabled = !emoji.checked
    frame = requestAnimationFrame(track)
  } catch (error) {
    console.error(error)
    const messages = {
      NotAllowedError: '摄像头权限被拒绝，请检查浏览器的网站权限',
      NotFoundError: '找不到可用的摄像头',
      NotReadableError: '摄像头无法读取，请检查是否被其他应用占用',
    }
    stop(messages[error.name] ?? '启动失败，请检查网络和摄像头后重试')
  } finally {
    camera.disabled = false
  }
}

function updateMirror() {
  stage.classList.toggle('mirror', mirror.checked)
}
mirror.addEventListener('change', updateMirror)
updateMirror()
emoji.addEventListener('change', () => {
  if (!emoji.checked && captureAt) {
    captureAt = 0
    captureGuide.hidden = true
    countdown.textContent = '快照已取消'
  }
  snapshot.disabled = !stream || camera.disabled || !emoji.checked || Boolean(captureAt)
})
window.addEventListener('pagehide', () => stop())
openGallery({ focus: false })

</script>
</body>
